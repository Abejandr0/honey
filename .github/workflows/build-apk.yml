name: Build Honey Wear OS APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Wear OS APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Validate Android String Resources
        run: python3 scripts/validate_strings.py

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          gradle assembleDebug --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Verify APK Generation
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "### 🍯 Honey Wear OS APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "Package: \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Wear OS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Honey-WearOS-v1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
